spring.application.name=demo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 1. 도커 내부 MySQL 컨테이너 연결 주소
spring.datasource.url=jdbc:mysql://mysql:3306/shelter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword

# 2. JPA 설정 (테이블 자동 생성 및 예쁜 SQL 로그 출력)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. 카카오 지도 API 키 (실제 발급받으신 키를 양쪽 이름 모두 등록)
