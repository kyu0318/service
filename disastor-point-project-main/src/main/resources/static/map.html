<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오 지도 프레임</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- 💡 카카오 지도 SDK 로드 -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=db487678d744dd9432c2429589b3e655&libraries=services,clusterer&autoload=false"></script>
</head>
<body>

<div id="map"></div>

<script>
    var map = null;
    var ps = null;
    var clusterer = null;
    var currentMarkers = [];
    var myLocationMarker = null;
    var searchLocationMarker = null;
    var isMapReady = false;

    // 💡 위도/경도 자동 판별 및 뒤바뀜 보정 함수
    function normalizeCoords(val1, val2) {
        var num1 = parseFloat(val1);
        var num2 = parseFloat(val2);
        if (isNaN(num1) || isNaN(num2)) return null;

        // 한국 기준: 위도는 30대, 경도는 120대
        if (num1 >= 30 && num1 <= 45 && num2 >= 120 && num2 <= 135) {
            return { lat: num1, lng: num2 };
        } else if (num2 >= 30 && num2 <= 45 && num1 >= 120 && num1 <= 135) {
            return { lat: num2, lng: num1 }; // 반대로 들어왔을 때 자동 교정
        }
        return { lat: num1, lng: num2 };
    }

    // 1. 카카오맵 SDK 수동 로드
    kakao.maps.load(function () {
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.4954, 127.0333),
            level: 7
        };
        map = new kakao.maps.Map(container, options);
        ps = new kakao.maps.services.Places();

        // 마커 클러스터러 생성
        clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 6
        });

        isMapReady = true;
        map.relayout();

        kakao.maps.event.addListener(map, 'idle', function () {
            var bounds = map.getBounds();
            var sw = bounds.getSouthWest();
            var ne = bounds.getNorthEast();

            if (window.parent && typeof window.parent.filterByBounds === 'function') {
                window.parent.filterByBounds({
                    minLat: sw.getLat(),
                    maxLat: ne.getLat(),
                    minLng: sw.getLng(),
                    maxLng: ne.getLng()
                });
            }
        });

        // 지도 생성 직후 부모창으로 1회 좌표 전송
        setTimeout(function () {
            if (map) kakao.maps.event.trigger(map, 'idle');
        }, 300);
    });

    /**
     * 2. 장소 검색 후 지도 이동
     */
    function searchPlace(keyword) {
        if (!isMapReady || !ps) return;

        ps.keywordSearch(keyword, function (data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                var targetPlace = data[0];
                var movePos = new kakao.maps.LatLng(targetPlace.y, targetPlace.x);

                if (searchLocationMarker) {
                    searchLocationMarker.setMap(null);
                }

                searchLocationMarker = new kakao.maps.Marker({
                    position: movePos,
                    map: map,
                    title: `🔍 검색 위치: ${targetPlace.place_name}`
                });

                map.setLevel(5);
                map.panTo(movePos);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert("일치하는 장소를 찾을 수 없습니다.");
            } else {
                alert("장소 검색 중 오류가 발생했습니다.");
            }
        });
    }

    /**
     * 3. 부모창에서 받은 데이터로 마커 생성 (좌표 보정 적용)
     */
    function setMarkers(dataList) {
        if (!isMapReady || !map || !clusterer) {
            setTimeout(function () { setMarkers(dataList); }, 150);
            return;
        }

        // 기존 마커 클러스터러 초기화
        clusterer.clear();
        for (var i = 0; i < currentMarkers.length; i++) {
            currentMarkers[i].setMap(null);
        }
        currentMarkers = [];

        if (!dataList || dataList.length === 0) return;

        var markers = [];

        dataList.forEach(function (shelter) {
            var rawLat = shelter.lat || shelter.la || shelter.latitude;
            var rawLng = shelter.lot || shelter.lng || shelter.lo || shelter.longitude;
            var coords = normalizeCoords(rawLat, rawLng);

            if (coords && coords.lat > 0 && coords.lng > 0) {
                var position = new kakao.maps.LatLng(coords.lat, coords.lng);
                var marker = new kakao.maps.Marker({
                    position: position,
                    title: shelter.name || shelter.shltNm || shelter.shl_nm || shelter.fclt_nm || '대피소'
                });

                kakao.maps.event.addListener(marker, 'click', function () {
                    map.setLevel(3);
                    map.panTo(position);
                    if (window.parent && typeof window.parent.selectShelterFromMap === 'function') {
                        window.parent.selectShelterFromMap(shelter);
                    }
                });

                markers.push(marker);
            }
        });

        currentMarkers = markers;
        clusterer.addMarkers(markers);
    }

    /**
     * 4. 내 위치 GPS 좌표로 지도 이동
     */
    function moveToUserLocation(lat, lng) {
        if (!isMapReady || !map) return;

        var coords = normalizeCoords(lat, lng);
        if (!coords) return;

        var userPos = new kakao.maps.LatLng(coords.lat, coords.lng);

        if (myLocationMarker) {
            myLocationMarker.setMap(null);
        }

        myLocationMarker = new kakao.maps.Marker({
            position: userPos,
            map: map,
            title: '📍 내 현재 위치'
        });

        map.setLevel(5);
        map.panTo(userPos);
    }

    /**
     * 5. 좌측 카드 클릭 시 해당 대피소 위치로 이동 (공습대피소 뒤바뀜 완벽 대응)
     */
    function panToLocation(lat, lng) {
        if (!isMapReady || !map) return;

        var coords = normalizeCoords(lat, lng);
        if (!coords) {
            console.error("유효하지 않은 좌표:", lat, lng);
            return;
        }

        var movePos = new kakao.maps.LatLng(coords.lat, coords.lng);
        map.setLevel(3);
        map.panTo(movePos);
    }
</script>
</body>
</html>
