# ------------------------------------------------------------------------------
# [애플리케이션 기본 설정]
# ------------------------------------------------------------------------------
spring.application.name=demo

# ------------------------------------------------------------------------------
# [DB 연결 설정]
# - 환경 변수가 있으면 환경 변수 값을, 없으면 가상머신 Rocky-DB(192.168.40.20)를 기본 사용
# ------------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.40.20:3306/shelter_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ------------------------------------------------------------------------------
# [JPA 설정]
# - DB 테이블 자동 변조로 인한 AIR_0_0 / PK 충돌 에러 방지
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# [💡 카카오 지도 API 키 설정]
# - MapViewController에서 @Value("${kakao.maps.api-key}")로 주입받습니다.
# ------------------------------------------------------------------------------
kakao.maps.api-key=${KAKAO_MAP_API_KEY:db487678d744dd9432c2429589b3e655}

# ------------------------------------------------------------------------------
# [Thymeleaf 템플릿 엔진 설정]
# - /map 요청 시 src/main/resources/templates/map.html을 정상 렌더링하도록 경로 명시
# ------------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false